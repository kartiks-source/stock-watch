<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Stock-out Watch</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <!-- Layout follows the Performity app: icon rail on the left, top bar, page title + subtitle, white cards on a pale blue page. -->
  <nav class="rail" id="tabs" aria-label="Sections">
    <a href="#brand" data-view="brand">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>
      <span class="rl">Brand report</span><span class="rs">Report</span>
    </a>
    <a href="#best" data-view="best">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m12 3.5 2.6 5.3 5.9.9-4.3 4.1 1 5.8L12 16.9l-5.2 2.7 1-5.8L3.5 9.7l5.9-.9z"/></svg>
      <span class="rl">Best sellers now</span><span class="rs">Best sellers</span><em id="n-best"></em>
    </a>
    <a href="#ads" data-view="ads">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 10v4h3l6 4V6L7 10z"/><path d="M16.5 9a4 4 0 0 1 0 6M19 6.5a7.5 7.5 0 0 1 0 11"/></svg>
      <span class="rl">Ads: push / pause</span><span class="rs">Ads</span>
    </a>
    <a href="#reorder" data-view="reorder">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 4h2.2l2.3 11h10.8l2.2-8H6.6"/><circle cx="9.5" cy="19" r="1.4"/><circle cx="17" cy="19" r="1.4"/></svg>
      <span class="rl">Restock list</span><span class="rs">Restock</span><em id="n-reorder"></em>
    </a>
    <a href="#products" data-view="products">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m12 3 8.5 4.5v9L12 21l-8.5-4.5v-9z"/><path d="M3.5 7.5 12 12l8.5-4.5M12 12v9"/></svg>
      <span class="rl">All products</span><span class="rs">Products</span>
    </a>
    <a href="#data" data-view="data" class="rail-end">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3c4.4 0 8 1.3 8 3s-3.6 3-8 3-8-1.3-8-3 3.6-3 8-3z"/><path d="M4 6v6c0 1.7 3.6 3 8 3s8-1.3 8-3V6M4 12v6c0 1.7 3.6 3 8 3s8-1.3 8-3v-6"/></svg>
      <span>Data</span>
    </a>
  </nav>

  <div class="shell">
    <header class="top">
      <a class="brand" href="#brand" aria-label="Stock-out Watch home">
        <img src="/favicon.svg" alt="" width="26" height="26"><b>Stock-out Watch</b>
      </a>
      <details class="colpick rolepick"><summary class="store-pill" title="Store · switch brand" aria-label="Store menu"><span id="store-name" class="store-name">Store</span>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m7 10 5 5 5-5"/></svg></summary><div class="menu"><div id="store-menu"></div></div></details>
      <div class="top-gap"></div>
      <span class="rlabel">Period</span><div class="range" role="group" aria-label="Period for every number on the page">
        <button data-days="7" aria-label="7 days">7<span class="wide-only"> days</span><span class="ph-d">d</span></button><button data-days="14" aria-label="14 days">14<span class="wide-only"> days</span><span class="ph-d">d</span></button><button data-days="30" class="on" aria-label="30 days">30<span class="wide-only"> days</span><span class="ph-d">d</span></button><button data-days="60" aria-label="60 days">60<span class="wide-only"> days</span><span class="ph-d">d</span></button><button data-days="month" title="From the 1st of this month (store time)"><span class="wide-only">This </span>month</button>
      </div><span class="rdates" id="rdates" aria-live="polite"></span>
      <a class="sync-pill" id="sync-pill" href="#data"><i></i><span>Data Sync</span></a>
      <form class="signout" method="post" action="/logout"><button class="icon-btn" type="submit" title="Sign out" aria-label="Sign out">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 4h4.5A1.5 1.5 0 0 1 20 5.5v13a1.5 1.5 0 0 1-1.5 1.5H14M10 16l-4-4 4-4M6 12h10"/></svg></button></form>
    </header>

    <div class="storebar" id="storebar" hidden></div>
    <div class="stale" id="stale" role="status" hidden></div>
    <main id="view" class="wrap" aria-live="polite"><p class="muted pad">Loading…</p></main>
    <footer class="source" id="source"></footer>
  </div>

  <aside class="drawer" id="drawer" hidden>
    <div class="drawer-card" role="dialog" aria-modal="true" aria-labelledby="drawer-title">
      <button class="x" id="drawer-close" aria-label="Close">×</button>
      <div id="drawer-body"></div>
    </div>
  </aside>
  <div class="toast" id="toast" hidden></div>
  <script src="/tz.js"></script>
  <script src="/ops.js"></script>
  <script src="/trial-input.js"></script>
  <script src="/stores.js"></script>
  <script src="/roles.js"></script>
  <script src="/digest-ui.js"></script>
  <script src="/people.js"></script>
  <script src="/import-ui.js"></script>
  <script src="/prod.js"></script>
  <script src="/brand.js"></script>
  <script src="/profile.js"></script>
  <script src="/money.js"></script>
  <script src="/weekly.js"></script>
  <script src="/targets.js"></script>
  <script src="/lists.js"></script>
  <script src="/app.js"></script>
</body>
</html>
